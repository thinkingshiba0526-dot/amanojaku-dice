<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あまのじゃくサイコロ｜考える赤柴</title>
<meta name="description" content="ポチッと押すと、Sunoで作った「あまのじゃく」6曲のどれを聴くか決まるサイコロです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF5EA;
    --card: #FFFDF8;
    --brown: #3E2A1F;
    --brown-soft: #7A6152;
    --akashiba: #B5582E;
    --chili: #D2352B;
    --blue: #7F96A8;
    --blue-soft: #E3EAF0;
    --line: #EADFCF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--brown);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 24px 24px;
    text-align: center;
    box-shadow: 0 6px 24px rgba(62, 42, 31, 0.08);
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 13px;
    color: var(--blue);
    letter-spacing: 0.08em;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    font-weight: 700;
  }
  .lead {
    margin: 0 0 28px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--brown-soft);
  }

  /* サイコロ */
  .dice {
    width: 132px;
    height: 132px;
    margin: 0 auto 24px;
    background: #fff;
    border: 3px solid var(--brown);
    border-radius: 26px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 16px;
    box-shadow: 0 5px 0 var(--brown);
  }
  .pip {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--brown);
    place-self: center;
    visibility: hidden;
  }
  .pip.on { visibility: visible; }
  .dice.one .pip.on { background: var(--chili); width: 30px; height: 30px; }
  .dice.rolling { animation: shake 0.12s linear infinite; }
  @keyframes shake {
    0%   { transform: rotate(-8deg) translateY(-2px); }
    50%  { transform: rotate(8deg) translateY(2px); }
    100% { transform: rotate(-8deg) translateY(-2px); }
  }

  /* 結果 */
  .result {
    min-height: 92px;
    margin-bottom: 20px;
  }
  .result-num {
    margin: 0;
    font-size: 15px;
    color: var(--brown-soft);
  }
  .result-title {
    margin: 4px 0 6px;
    font-size: 24px;
    font-weight: 700;
    color: var(--akashiba);
  }
  .result-note {
    margin: 0;
    font-size: 14px;
    color: var(--brown-soft);
  }
  .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 12px;
    border-radius: 999px;
    background: var(--blue-soft);
    color: #4E6576;
    font-size: 12px;
  }

  /* ボタン */
  button {
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 16px 20px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    background: var(--chili);
    box-shadow: 0 4px 0 #A1261E;
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #A1261E; }
  button:disabled { opacity: 0.7; cursor: wait; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .back {
    margin: 18px 0 0;
    font-size: 13px;
    line-height: 1.7;
    color: var(--brown-soft);
  }
  footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    color: var(--brown-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .dice.rolling { animation: none; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Sunoで作った6曲</p>
  <h1>あまのじゃくサイコロ🎲</h1>
  <p class="lead">どれを聴くか迷ったら、<br>ポチッと振ってみてね。</p>

  <div class="dice one" id="dice" aria-hidden="true">
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
    <span class="pip"></span><span class="pip on"></span><span class="pip"></span>
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
  </div>

  <div class="result" id="result" aria-live="polite">
    <p class="result-num">まだ振っていません</p>
    <p class="result-title">？</p>
  </div>

  <button type="button" id="roll">サイコロを振る</button>

  <p class="back">番号が出たら、記事に戻って<br>その番号の曲を聴いてみてください🎶</p>

  <footer>考える赤柴</footer>
</main>

<script>
  // 曲のリスト（番号・曲名・合いの手の量）
  const songs = [
    { no: "①", title: "ジャパニーズロック", tag: "合いの手入り" },
    { no: "②", title: "ジャパニーズポップ", tag: "合いの手入り" },
    { no: "③", title: "UKロック", tag: "合いの手入り" },
    { no: "④", title: "ジャズロック", tag: "合いの手少なめ" },
    { no: "⑤", title: "UKロック", tag: "合いの手少なめ" },
    { no: "⑥", title: "UKパンク", tag: "合いの手少なめ" }
  ];

  // サイコロの目の並び（3×3のマスのどこに点を置くか）
  const faces = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  const dice = document.getElementById("dice");
  const pips = dice.querySelectorAll(".pip");
  const result = document.getElementById("result");
  const button = document.getElementById("roll");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function showFace(n) {
    pips.forEach((pip, i) => pip.classList.toggle("on", faces[n].includes(i)));
    dice.classList.toggle("one", n === 1);
  }

  function randomFace() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function showResult(n) {
    const song = songs[n - 1];
    result.innerHTML =
      '<p class="result-num">' + n + ' が出ました！</p>' +
      '<p class="result-title">' + song.no + ' ' + song.title + '</p>' +
      '<span class="tag">' + song.tag + '</span>';
  }

  button.addEventListener("click", () => {
    const final = randomFace();
    if (reduceMotion) {
      showFace(final);
      showResult(final);
      return;
    }
    button.disabled = true;
    button.textContent = "コロコロ…";
    result.innerHTML = '<p class="result-num">コロコロ…</p><p class="result-title">？</p>';
    dice.classList.add("rolling");

    let count = 0;
    const timer = setInterval(() => {
      showFace(randomFace());
      count++;
      if (count >= 12) {
        clearInterval(timer);
        dice.classList.remove("rolling");
        showFace(final);
        showResult(final);
        button.disabled = false;
        button.textContent = "もう一回振る";
      }
    }, 70);
  });
</script>
</body>
</html>
